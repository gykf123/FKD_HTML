<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FKD · lab 迭代试验台</title>
<meta name="referrer" content="no-referrer" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#e8eaed;
    background:radial-gradient(700px 480px at 18% 20%,#5b8cff55,transparent 60%),radial-gradient(620px 420px at 84% 26%,#b15bff48,transparent 60%),linear-gradient(135deg,#0b0f2a,#161a3a);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .card{width:100%;max-width:640px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:30px 30px 24px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
  .tag{display:inline-block;font-size:12px;color:#7ff0a8;border:1px solid rgba(127,240,168,.4);border-radius:999px;padding:3px 12px;margin-bottom:14px}
  h1{font-size:21px;margin-bottom:8px;letter-spacing:.5px}
  p{color:#9aa0aa;font-size:13px;line-height:1.75;margin:8px 0}
  code{background:rgba(255,255,255,.08);border-radius:6px;padding:1px 7px;color:#cfe0ff;font-size:12px;word-break:break-all}
  #lab{margin-top:16px;border:1px dashed rgba(255,255,255,.22);border-radius:12px;padding:16px;background:rgba(255,255,255,.03);font-size:13px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  .row:last-child{border-bottom:none}
  .ok{color:#7ff0a8}.bad{color:#ff8a8a}.run{color:#8a909c}
  input{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#e8eaed;font-size:13px}
  button{margin-top:10px;padding:10px 16px;border-radius:10px;border:1px solid rgba(127,240,168,.4);background:rgba(127,240,168,.12);color:#7ff0a8;font-size:13px;cursor:pointer}
  a.back{display:inline-block;margin-top:16px;color:#6f9bff;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main class="card">
  <span class="tag">自主迭代试验台 · v1.9.19 候选</span>
  <h1>一次性登录票（ticket）兑换</h1>
  <p>本轮目标：<strong>让 JWT 不再出现在 URL 上</strong>。登录站登录成功后先用 JWT 换一张 2 分钟有效、只能用一次的票，URL 上只带票，主站再用票换回 JWT。下面用<strong>真实票</strong>验证兑换链路。</p>
  <div id="lab"><span class="run">检测中…</span></div>
  <input id="tk" placeholder="也可手动粘贴 ticket 后点兑换" />
  <button id="go">手动兑换</button>
  <a class="back" href="/">← 返回 FKD 主页</a>
</main>
<script>
  const SUPABASE_URL = 'https://yowwyasttkywyqgseuqz.supabase.co';
  const ANON_KEY = 'sb_publishable_j4rpi2ejPTMGxo79uaaX3g_kQYrinS4';
  const AUTH_TOKEN_KEY = 'fkd_auth_token';
  const box = document.getElementById('lab');
  function row(name, state, detail) {
    const d = document.createElement('div'); d.className = 'row';
    const cls = state === 'ok' ? 'ok' : (state === 'bad' ? 'bad' : 'run');
    d.innerHTML = '<span>' + name + '</span><span class="' + cls + '">' + detail + '</span>';
    box.appendChild(d);
  }

  // ===== 与主站 app.js 待同步的兑换逻辑一致 =====
  function cleanUrl() {
    try {
      const p = new URLSearchParams(location.search);
      p.delete('ticket'); p.delete('token');
      history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : '') + location.hash);
    } catch (e) {}
  }
  function redeem(ticket, cb) {
    fetch(SUPABASE_URL + '/functions/v1/auth-exchange', {
      method: 'POST',
      headers: { apikey: ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'redeem', ticket: ticket })
    }).then(r => r.json()).then(d => cb(d)).catch(e => cb({ error: '网络失败' }));
  }

  (function captureLogin() {
    const params = new URLSearchParams(location.search);
    const ticket = params.get('ticket');
    const direct = params.get('token');
    box.innerHTML = '';
    if (direct) {
      try { localStorage.setItem(AUTH_TOKEN_KEY, direct); } catch (e) {}
      cleanUrl();
      row('兼容旧链路 ?token=', 'ok', '已落地并清除 URL 参数');
      return;
    }
    if (!ticket) { row('等待票据', 'run', '请带 ?ticket=xxx 访问，或在下方手动粘贴'); return; }
    row('① 收到票据', 'ok', ticket.slice(0, 8) + '…（长度 ' + ticket.length + '）');
    redeem(ticket, function (d) {
      cleanUrl();
      if (d && d.token) {
        try { localStorage.setItem(AUTH_TOKEN_KEY, d.token); } catch (e) {}
        row('② 兑换 JWT', 'ok', '成功，token 长度 ' + d.token.length);
        row('③ URL 已清除票据', location.search.indexOf('ticket') === -1 ? 'ok' : 'bad', location.search || '(已无查询串)');
        row('④ 已落地 localStorage', localStorage.getItem(AUTH_TOKEN_KEY) ? 'ok' : 'bad', 'fkd_auth_token 已写入');
        // 同一张票重放：必须失败（一次性）
        redeem(ticket, function (d2) {
          row('⑤ 同票重放', (!d2 || !d2.token) ? 'ok' : 'bad', (d2 && d2.error) ? ('已拒绝：' + d2.error) : '异常：竟然又拿到了 token');
        });
      } else {
        row('② 兑换 JWT', 'bad', (d && d.error) || '未返回 token');
      }
    });
  })();

  document.getElementById('go').onclick = function () {
    const v = document.getElementById('tk').value.trim();
    if (!v) return;
    box.innerHTML = '';
    redeem(v, function (d) {
      if (d && d.token) { try { localStorage.setItem(AUTH_TOKEN_KEY, d.token); } catch (e) {} row('手动兑换', 'ok', '成功，token 长度 ' + d.token.length); }
      else row('手动兑换', 'bad', (d && d.error) || '未返回 token');
    });
  };
</script>
</body>
</html>
